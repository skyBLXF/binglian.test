<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>病恋 · 暗黑网格</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #0b0b0f;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 50px 50px, 50px 50px, 10px 10px, 10px 10px;
            background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at 30% 40%, rgba(120, 40, 180, 0.15), transparent 70%);
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -30%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle at 70% 60%, rgba(200, 50, 100, 0.10), transparent 70%);
            pointer-events: none;
            z-index: 0;
            filter: blur(60px);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(12, 12, 18, 0.65);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 28px 22px 34px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
            transition: all 0.2s ease;
        }

        /* ===== 顶部：SKY背离 + 密钥 ===== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sky-badge {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
        }

        .sky-badge span {
            color: rgba(180, 130, 255, 0.5);
            font-weight: 300;
            margin-left: 6px;
        }

        .key-code {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1.5px;
            text-shadow: 0 0 40px rgba(150, 80, 220, 0.15);
        }

        .header .sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 5px;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }
        .progress-bar {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #8b5cf6, #d946ef);
            border-radius: 4px;
            transition: width 0.35s ease;
        }
        .progress-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 500;
            min-width: 40px;
            text-align: right;
            letter-spacing: 0.5px;
        }

        .page-indicator {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            text-align: center;
            margin-bottom: 18px;
            letter-spacing: 1.5px;
        }

        .question-area {
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 500;
            color: #f0ecff;
            line-height: 1.6;
            margin-bottom: 26px;
            min-height: 64px;
            letter-spacing: 0.3px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 16px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            backdrop-filter: blur(4px);
        }
        .option:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .option .tag {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }
        .option.selected {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.25);
        }
        .option.selected .tag {
            background: #8b5cf6;
            color: #fff;
            border-color: #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
        }

        .result-page {
            display: none;
            animation: fadeIn 0.6s ease;
        }
        .result-page.active {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 21px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }
        .result-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.15);
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .result-tags {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .result-tags .tag-item {
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
        }
        .result-tags .tag-item.highlight {
            background: rgba(139, 92, 246, 0.12);
            border-color: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }

        .chart-wrap {
            margin: 12px 0 18px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            padding: 16px 8px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .result-desc {
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
            padding: 0 4px;
            letter-spacing: 0.3px;
        }

        .hidden {
            display: none !important;
        }

        .btn-restart {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.25s;
            text-align: center;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        .btn-restart:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
        }

        #questionPage {
            display: block;
        }
        #resultPage {
            display: none;
        }
        #resultPage.active {
            display: block;
        }
        #questionPage.hidden {
            display: none;
        }

        @media (max-width: 420px) {
            .container {
                padding: 20px 16px 28px;
                border-radius: 28px;
            }
            .question-text {
                font-size: 16px;
            }
            .option {
                font-size: 14px;
                padding: 12px 14px;
            }
            .top-bar {
                flex-wrap: wrap;
                gap: 6px;
            }
            .sky-badge {
                font-size: 11px;
            }
            .key-code {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="app">

        <!-- 🖤 SKY背离 + BLXF0919 标识 -->
        <div class="top-bar">
            <div class="sky-badge">✦ SKY背离 <span>· 暗核</span></div>
            <div class="key-code">BLXF0919</div>

            <div class="sub">DARK LOVE · GRID ANALYSIS</div>
        </div>

        <div class="progress-wrap">
            <div class="progress-bar">

            </div>

        <!-- ===== 答题区 ===== -->
        <div id="questionPage">
            <div class="page-indicator" id="pageIndicator">第 1 / 10 页</div>

                <div class="question-text" id="questionText">加载题目中...</div>
                <div class="options" id="optionsContainer"></div>

        <!-- ===== 结果区 ===== -->
        <div id="resultPage" class="result-page">

            <div class="result-subtitle">— 暗黑网格 · 深度剖析 —</div>
            <div class="result-tags" id="tagContainer">
                <span class="tag-item" id="tagPower">权力位置</span>
                <span class="tag-item" id="tagEmotion">情感内核</span>
            </div>
            <div class="chart-wrap">
                <canvas id="radarChart" height="230"></canvas>
            </div>
            <div class="result-desc" id="resultDesc">感谢参与测评，愿你更了解自己。</div>
            <button class="btn-restart" onclick="resetTest()">↺ 重新测试</button>
        </div>
    </div>

            // 极端行为 (41-50)
            { text: '伴侣坚决要分手，你会？', dim: '极端行为', opts: ['用自残威胁逼他留下', '苦苦哀求，下跪挽留', '冷静接受', '立刻找新欢报复'] },
            { text: '你能接受带"疼痛"的亲密行为吗？', dim: '极端行为', opts: ['非常喜欢', '可以接受轻度', '不太能接受', '绝对拒绝'] },
            { text: '情绪失控时你会对伴侣动手吗？', dim: '极端行为', opts: ['会', '会摔东西但不动手', '不会，自己躲开', '用言语暴击'] },
            { text: '你会跟踪或定位伴侣吗？', dim: '极端行为', opts: ['会，共享实时定位', '会偷偷装定位器', '不会', '想过，但忍住了'] },
            { text: '伴侣让你放弃梦想，你会？', dim: '极端行为', opts: ['为了他放弃一切', '犹豫后妥协', '坚决不行', '口头答应，背地继续'] },
            { text: '爱情和占有欲的关系是？', dim: '极端行为', opts: ['等同，不爱就不会占有', '占有欲是爱的副产品', '没关系，爱是尊重', '占有欲是病'] },
            { text: '会用怀孕/生病捆绑对方吗？', dim: '极端行为', opts: ['会，是筹码', '开玩笑说过', '绝对不会', '幻想过，不敢实施'] },
            { text: '看到伴侣痛哭，你的感受是？', dim: '极端行为', opts: ['兴奋，征服感', '心疼不已', '不知所措', '等他哭完'] },
            { text: '理想关系的终点是？', dim: '极端行为', opts: ['死后也要葬在一起', '白头偕老', '各自成就更好的自己', '随时可抽离'] },
            { text: '你的爱情观最接近？', dim: '极端行为', opts: ['顺我者昌，逆我者亡', '飞蛾扑火，至死方休', '相敬如宾，举案齐眉', '君子之交淡如水'] }
        ];

        // ============================================================
        //  2. 打乱题目顺序 (Fisher-Yates)
        // ============================================================
        function shuffleArray(arr) {
            var a = arr.slice();
            for (var i = a.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = a[i];
                a[i] = a[j];
                a[j] = temp;
            }
            return a;
        }

        var questions = shuffleArray(RAW_QUESTIONS);

        // ============================================================
        //  3. 应用状态
        // ============================================================
        var dims = ['权力支配', '情感痴迷', '分离焦虑', '忠诚排他', '极端行为'];
        var total = questions.length;
        var answers = new Array(total);
        var scores = {};
        for (var d = 0; d < dims.length; d++) {
            scores[dims[d]] = 0;
        }
        for (var a = 0; a < total; a++) {
            answers[a] = -1;
        }

        var currentIndex = 0;
        var chartInstance = null;

        // DOM
        var qText = document.getElementById('questionText');
        var optContainer = document.getElementById('optionsContainer');
        var progressFill = document.getElementById('progressFill');
        var progressText = document.getElementById('progressText');
        var pageIndicator = document.getElementById('pageIndicator');
        var questionPage = document.getElementById('questionPage');
        var resultPage = document.getElementById('resultPage');

        // ============================================================
        //  4. 渲染
        // ============================================================
        function renderQuestion(index) {
            var q = questions[index];
            qText.textContent = q.text;
            var letters = ['A', 'B', 'C', 'D'];
            optContainer.innerHTML = '';

            for (var i = 0; i < q.opts.length; i++) {
                var div = document.createElement('div');
                div.className = 'option';
                if (answers[index] === i) div.classList.add('selected');
                div.innerHTML = '<span class="tag">' + letters[i] + '</span><span>' + q.opts[i] + '</span>';
                div.addEventListener('click', (function(idx, optIdx) {
                    return function() {
                        selectOption(idx, optIdx);
                    };
                })(index, i));
                optContainer.appendChild(div);
            }

            var pct = Math.round((index / total) * 100);
            progressFill.style.width = pct + '%';
            progressText.textContent = pct + '%';

            var pageNum = Math.floor(index / 5) + 1;
            var totalPages = Math.ceil(total / 5);
            pageIndicator.textContent = '第 ' + pageNum + ' / ' + totalPages + ' 页';
        }

        // ============================================================
        //  5. 选择逻辑
        // ============================================================
        function selectOption(index, optIdx) {
            if (answers[index] !== -1) return;
            answers[index] = optIdx;

            var opts = optContainer.children;
            for (var i = 0; i < opts.length; i++) {
                if (i === optIdx) {
                    opts[i].classList.add('selected');
                } else {
                    opts[i].classList.remove('selected');
                }
            }

            var q = questions[index];
            var score = 0;
            if (optIdx === 0) score = 3;
            else if (optIdx === 1) score = 2;
            else if (optIdx === 2) score = 0;
            else if (optIdx === 3) score = 1;
            scores[q.dim] = (scores[q.dim] || 0) + score;

            setTimeout(function() {
                if (currentIndex < total - 1) {
                    currentIndex++;
                    renderQuestion(currentIndex);
                } else {
                    showResult();
                }
            }, 280);
        }

        // ============================================================
        //  6. 结果页
        // ============================================================
        function showResult() {
            questionPage.style.display = 'none';
            resultPage.classList.add('active');

            var dimScores = [];
            for (var d = 0; d < dims.length; d++) {
                dimScores.push(scores[dims[d]] || 0);
            }

            var aCount = 0,
                bCount = 0;
            for (var i = 0; i < answers.length; i++) {
                var q = questions[i];
                if (q.dim === '权力支配') {
                    if (answers[i] === 0) aCount++;
                    else if (answers[i] === 1) bCount++;
                }
            }
            var powerLabel = '⚖️ 平权';
            if (aCount > bCount) powerLabel = '🔺 上位';
            else if (aCount < bCount) powerLabel = '🔻 下位';

            var dCount = 0,
                abCount = 0;
            for (var j = 0; j < answers.length; j++) {
                var q2 = questions[j];
                if (q2.dim === '情感痴迷') {
                    if (answers[j] === 3) dCount++;
                    else if (answers[j] === 0 || answers[j] === 1) abCount++;
                }
            }
            var emotionLabel = '🌿 日常';
            if (abCount >= 7) emotionLabel = '🔥 高压';
            else if (dCount >= 6) emotionLabel = '🎣 低恋·钓系';

            document.getElementById('tagPower').textContent = powerLabel;
            document.getElementById('tagEmotion').textContent = emotionLabel;

            var ctx = document.getElementById('radarChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: dims,
                    datasets: [{
                        label: '你的得分',
                        data: dimScores,
                        backgroundColor: 'rgba(139, 92, 246, 0.15)',
                        borderColor: '#a78bfa',
                        borderWidth: 2,
                        pointBackgroundColor: '#8b5cf6',
                        pointBorderColor: '#0b0b0f',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        r: {
                            max: 30,
                            min: 0,
                            ticks: { stepSize: 5, color: 'rgba(255,255,255,0.1)', backdropColor: 'transparent' },
                            grid: { color: 'rgba(255,255,255,0.03)' },
                            angleLines: { color: 'rgba(255,255,255,0.03)' },
                            pointLabels: { color: 'rgba(255,255,255,0.25)', font: { size: 10 } }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: { color: 'rgba(255,255,255,0.15)', font: { size: 10 } }
                        }
                    }
                }
            });

            var desc = document.getElementById('resultDesc');
            var totalScore = 0;
            for (var s = 0; s < dimScores.length; s++) {
                totalScore += dimScores[s];
            }
            if (totalScore > 80) desc.textContent = '你在关系中展现出强烈的支配与痴迷倾向，需警惕过度控制带来的负面影响。';
            else if (totalScore > 60) desc.textContent = '你具有一定的掌控欲和情感依赖，建议在亲密关系中保持适度边界。';
            else if (totalScore > 40) desc.textContent = '你在关系中较为理性，懂得尊重对方，但仍需关注情感深度的培养。';
            else desc.textContent = '你在关系中偏向疏离和独立，或许需要更多尝试打开心扉，体验深度联结。';
        }

        // ============================================================
        //  7. 重置
        // ============================================================
        function resetTest() {
            currentIndex = 0;
            for (var i = 0; i < answers.length; i++) answers[i] = -1;
            for (var d = 0; d < dims.length; d++) scores[dims[d]] = 0;
            if (chartInstance) { chartInstance.destroy();
                chartInstance = null; }
            resultPage.classList.remove('active');
            questionPage.style.display = 'block';
            renderQuestion(0);
        }

        // ============================================================
        //  8. 启动 (确保页面完全加载后执行)
        // ============================================================
        window.addEventListener('load', function() {
            renderQuestion(0);
        });
    </script>

</body>
</html>
